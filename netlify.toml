# Netlify Configuration for Sign Language Studio
# Enables static zero-config deployment, camera/mic permissions, and optimal routing

[build]
  publish = "."

# Route root '/' directly to the B2B SaaS landing page
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# Allow direct access to the detector at /index.html
[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

# Security & Hardware Access Headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Permissions-Policy = "camera=(self), microphone=(self)"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Aggressive caching for static deep learning weights
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caching for illustrated ASL reference assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
