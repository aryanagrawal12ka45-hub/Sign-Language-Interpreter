# Netlify Configuration for Sign Language Studio
# Enables static zero-config deployment, camera/mic permissions, and optimal routing

[build]
  publish = "."

# Redirect legacy /landing.html to root '/'
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
  force = true

# Security & Hardware Access Headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Permissions-Policy = "camera=(self), microphone=(self)"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Aggressive caching for static deep learning weights
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caching for illustrated ASL reference assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
